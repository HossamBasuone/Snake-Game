<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<style>
:root{
  color-scheme: light;
  --bg:#e9efe4; --panel:#f7faf3; --ink:#1d2a1a; --muted:#5d6b58;
  --c1:#cfdcc4; --c2:#c3d3b7; --snake:#2f7d32; --head:#1b5e20; --apple:#d6322b; --accent:#2f7d32;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#10170f; --panel:#192417; --ink:#e4efdf; --muted:#8fa389;
    --c1:#1f2d1d; --c2:#223220; --snake:#5fc45f; --head:#8ae68a; --apple:#ff5a4e; --accent:#5fc45f;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#10170f; --panel:#192417; --ink:#e4efdf; --muted:#8fa389;
  --c1:#1f2d1d; --c2:#223220; --snake:#5fc45f; --head:#8ae68a; --apple:#ff5a4e; --accent:#5fc45f;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:16px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:16px;touch-action:manipulation}
.app{width:min(100%,480px);display:flex;flex-direction:column;gap:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:1.5rem;letter-spacing:.02em}
.stats{display:flex;gap:8px}
.stat{background:var(--panel);border-radius:10px;padding:4px 12px;text-align:center;min-width:64px}
.stat small{display:block;color:var(--muted);font-size:.7rem}
.stat b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.wrap{position:relative;background:var(--panel);border-radius:14px;padding:8px}
canvas{display:block;width:100%;aspect-ratio:1;border-radius:8px}
.overlay{position:absolute;inset:8px;border-radius:8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;text-align:center;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(3px)}
.overlay[hidden]{display:none}
.overlay h2{margin:0;font-size:1.6rem}
.overlay p{margin:0;color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 18px;
  background:var(--accent);color:var(--bg);font-weight:700}
button.ghost{background:var(--panel);color:var(--ink)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:6px;justify-content:center}
.pad button{padding:0;font-size:1.3rem;background:var(--panel);color:var(--ink)}
.pad .u{grid-column:2}.pad .l{grid-row:2;grid-column:1}.pad .d{grid-row:2;grid-column:2}.pad .r{grid-row:2;grid-column:3}
.opts{display:flex;flex-direction:column;gap:8px;align-items:center}
.opt{display:flex;align-items:center;gap:10px}
.opt span{color:var(--muted);font-size:.85rem;min-width:70px;text-align:right}
.seg{display:flex;background:var(--panel);border-radius:10px;padding:3px;gap:2px}
.seg button{background:transparent;color:var(--ink);padding:6px 14px;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.seg button:disabled{opacity:.55;cursor:not-allowed}
.wrap{border:2px solid var(--ink)}
.wrap.endless{border:2px dashed var(--accent)}
.hint{text-align:center;color:var(--muted);font-size:.85rem;margin:0}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
</style>
</head>
<body>
<main class="app">
  <div class="bar">
    <h1>Snake</h1>
    <div class="stats">
      <div class="stat"><small>Score</small><b id="score">0</b></div>
      <div class="stat"><small>Best</small><b id="best">0</b></div>
    </div>
  </div>

  <div class="wrap" id="wrap">
    <canvas id="c" width="480" height="480" aria-label="Snake game board"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Snake</h2>
      <p id="ovText">Eat apples, avoid walls and yourself.</p>
      <button id="startBtn">Start game</button>
    </div>
  </div>

  <div class="opts">
    <div class="opt"><span>Difficulty</span>
      <div class="seg" role="group" aria-label="Difficulty">
        <button data-k="diff" data-v="easy">Easy</button>
        <button data-k="diff" data-v="normal">Normal</button>
        <button data-k="diff" data-v="hard">Hard</button>
      </div></div>
    <div class="opt"><span>World</span>
      <div class="seg" role="group" aria-label="World">
        <button data-k="world" data-v="walls">Walls</button>
        <button data-k="world" data-v="endless">Endless</button>
      </div></div>
  </div>

  <div class="pad" aria-label="Direction controls">
    <button class="u" data-d="Up" aria-label="Up">▲</button>
    <button class="l" data-d="Left" aria-label="Left">◀</button>
    <button class="d" data-d="Down" aria-label="Down">▼</button>
    <button class="r" data-d="Right" aria-label="Right">▶</button>
  </div>

  <div class="row">
    <button class="ghost" id="pauseBtn">Pause</button>
    <button class="ghost" id="restartBtn">Restart</button>
  </div>
  <p class="hint">Arrow keys or WASD to move, Space to pause. On touch, swipe the board.<br>Endless world: the dashed border means edges wrap around. Settings lock during a game.</p>
</main>

<script>
const $ = s => document.querySelector(s);
const SIZE = 16;
const DIRS = { Up:[-1,0], Down:[1,0], Left:[0,-1], Right:[0,1] };
const OPP  = { Up:"Down", Down:"Up", Left:"Right", Right:"Left" };
const cv = $('#c'), ctx = cv.getContext('2d'), CELL = cv.width / SIZE;

// difficulty: start delay, fastest delay, ms faster per apple
const LEVELS = { easy:{base:200,min:110,step:3}, normal:{base:160,min:70,step:4}, hard:{base:110,min:45,step:5} };
let cfg = { diff:"normal", world:"walls" };   // walls = hitting an edge ends the game, endless = edges wrap around
try { Object.assign(cfg, JSON.parse(localStorage.getItem('snake-cfg') || '{}')); } catch (e) {}
if (!LEVELS[cfg.diff]) cfg.diff = "normal";
if (cfg.world !== "endless") cfg.world = "walls";

let state, timer = null, bestScore = 0;
const bestKey = () => 'snake-best-' + cfg.diff + '-' + cfg.world;   // one best score per mode
function loadBest(){
  bestScore = 0;
  try { bestScore = +localStorage.getItem(bestKey()) || 0; } catch (e) {}
  $('#best').textContent = bestScore;
}
function refreshOpts(){
  const locked = state && (state.status === "running" || state.status === "paused");
  document.querySelectorAll('.seg button').forEach(b => {
    b.setAttribute('aria-pressed', cfg[b.dataset.k] === b.dataset.v);
    b.disabled = locked;
  });
  $('#wrap').classList.toggle('endless', cfg.world === "endless");
}
loadBest();

function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function newState(){
  return {
    snake: [[8,3],[8,4],[8,5]],      // tail -> head
    direction: "Right",
    queue: [],                        // buffered turns, so fast key presses never reverse the snake
    apple: null,
    score: 0,
    status: "ready"                   // ready | running | paused | over | won
  };
}

function isSnake(i, j){ return state.snake.some(c => c[0] === i && c[1] === j); }

function createApple(){
  const free = [];
  for (let i = 0; i < SIZE; i++)
    for (let j = 0; j < SIZE; j++)
      if (!isSnake(i, j)) free.push([i, j]);
  return free.length ? free[Math.floor(Math.random() * free.length)] : null;
}

function speed(){ const L = LEVELS[cfg.diff]; return Math.max(L.min, L.base - state.score * L.step); }

function schedule(){
  clearTimeout(timer);
  timer = setTimeout(tick, speed());
}

function tick(){
  if (state.status !== "running") return;
  if (state.queue.length) state.direction = state.queue.shift();

  const [di, dj] = DIRS[state.direction];
  const [hi, hj] = state.snake[state.snake.length - 1];
  let ni = hi + di, nj = hj + dj;
  if (cfg.world === "endless"){ ni = (ni + SIZE) % SIZE; nj = (nj + SIZE) % SIZE; }
  const eating = state.apple && state.apple[0] === ni && state.apple[1] === nj;

  // wall hit
  if (ni < 0 || nj < 0 || ni >= SIZE || nj >= SIZE) return end("You hit the wall.");
  // self hit (the tail cell is free if we are not growing, since it moves away)
  const body = eating ? state.snake : state.snake.slice(1);
  if (body.some(c => c[0] === ni && c[1] === nj)) return end("You ran into yourself.");

  state.snake.push([ni, nj]);
  if (eating){
    state.score++;
    state.apple = createApple();
    if (!state.apple) return end("You filled the board!", true);
    updateScore();
  } else {
    state.snake.shift();
  }
  draw();
  schedule();
}

function updateScore(){
  $('#score').textContent = state.score;
  if (state.score > bestScore){
    bestScore = state.score;
    $('#best').textContent = bestScore;
    try { localStorage.setItem(bestKey(), bestScore); } catch (e) {}
  }
}

function end(msg, won){
  state.status = won ? "won" : "over";
  clearTimeout(timer);
  draw();
  $('#ovTitle').textContent = won ? "You win" : "Game over";
  $('#ovText').textContent = msg + " Score: " + state.score;
  $('#startBtn').textContent = "Play again";
  $('#overlay').hidden = false;
  $('#pauseBtn').textContent = "Pause";
}

function draw(){
  refreshOpts();
  for (let i = 0; i < SIZE; i++)
    for (let j = 0; j < SIZE; j++){
      ctx.fillStyle = (i + j) % 2 ? css('--c1') : css('--c2');
      ctx.fillRect(j * CELL, i * CELL, CELL, CELL);
    }
  if (state.apple){
    const [ai, aj] = state.apple;
    ctx.fillStyle = css('--apple');
    ctx.beginPath();
    ctx.arc(aj * CELL + CELL/2, ai * CELL + CELL/2, CELL * 0.36, 0, Math.PI * 2);
    ctx.fill();
  }
  const n = state.snake.length;
  state.snake.forEach(([i, j], k) => {
    ctx.fillStyle = css(k === n - 1 ? '--head' : '--snake');
    const p = 2;
    ctx.beginPath();
    ctx.roundRect(j * CELL + p, i * CELL + p, CELL - p*2, CELL - p*2, 7);
    ctx.fill();
  });
  // eyes
  const [hi, hj] = state.snake[n - 1];
  const [di, dj] = DIRS[state.direction];
  ctx.fillStyle = css('--bg');
  const cx = hj * CELL + CELL/2 + dj * 6, cy = hi * CELL + CELL/2 + di * 6;
  const ox = di ? 6 : 0, oy = dj ? 6 : 0;
  [[-1],[1]].forEach(([s]) => {
    ctx.beginPath();
    ctx.arc(cx + s * ox, cy + s * oy, 2.6, 0, Math.PI * 2);
    ctx.fill();
  });
}

function start(){
  clearTimeout(timer);
  state = newState();
  state.apple = createApple();
  state.status = "running";
  $('#score').textContent = 0;
  $('#overlay').hidden = true;
  $('#pauseBtn').textContent = "Pause";
  draw();
  schedule();
}

function togglePause(){
  if (state.status === "running"){
    state.status = "paused";
    clearTimeout(timer);
    $('#ovTitle').textContent = "Paused";
    $('#ovText').textContent = "Press Space or Resume to continue.";
    $('#startBtn').textContent = "Resume";
    $('#overlay').hidden = false;
    $('#pauseBtn').textContent = "Resume";
  } else if (state.status === "paused"){
    state.status = "running";
    $('#overlay').hidden = true;
    $('#pauseBtn').textContent = "Pause";
    schedule();
  }
}

function turn(dir){
  if (!state || state.status !== "running") return;
  // compare against the last queued direction (or the current one), so two quick presses can't reverse the snake
  const last = state.queue.length ? state.queue[state.queue.length - 1] : state.direction;
  if (dir === last || dir === OPP[last]) return;
  if (state.queue.length < 3) state.queue.push(dir);
}

// keyboard
const KEYS = {
  KeyW:"Up", ArrowUp:"Up", KeyS:"Down", ArrowDown:"Down",
  KeyA:"Left", ArrowLeft:"Left", KeyD:"Right", ArrowRight:"Right"
};
window.addEventListener('keydown', e => {
  if (KEYS[e.code]){ e.preventDefault(); turn(KEYS[e.code]); }   // stops the page from scrolling
  else if (e.code === "Space"){ e.preventDefault(); togglePause(); }
  else if (e.code === "Enter" && state.status !== "running" && state.status !== "paused") start();
});

// difficulty / world selectors (locked while a game is in progress)
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  if (state.status === "running" || state.status === "paused") return;
  cfg[b.dataset.k] = b.dataset.v;
  try { localStorage.setItem('snake-cfg', JSON.stringify(cfg)); } catch (e) {}
  loadBest();
  refreshOpts();
});

// buttons
$('#startBtn').onclick = () => state.status === "paused" ? togglePause() : start();
$('#restartBtn').onclick = start;
$('#pauseBtn').onclick = togglePause;
document.querySelectorAll('.pad button').forEach(b => b.onclick = () => turn(b.dataset.d));

// swipe
let t0 = null;
$('#wrap').addEventListener('touchstart', e => { t0 = e.touches[0]; }, { passive: true });
$('#wrap').addEventListener('touchmove', e => e.preventDefault(), { passive: false });
$('#wrap').addEventListener('touchend', e => {
  if (!t0) return;
  const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
  t0 = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "Right" : "Left") : (dy > 0 ? "Down" : "Up"));
});

// auto-pause when the tab is hidden
document.addEventListener('visibilitychange', () => { if (document.hidden) togglePauseIfRunning(); });
function togglePauseIfRunning(){ if (state.status === "running") togglePause(); }

state = newState();
state.apple = createApple();
draw();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
</script>
</body>
</html>
